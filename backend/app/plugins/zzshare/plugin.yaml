# zzshare 免费 A 股量化数据插件 (https://github.com/zzquant/zzshare)
# Python 型插件 (runtime: python), 依赖 zzshare 包。免费可用, 默认 anonymous token
# (无 key 无需注册); 可选环境变量 ZZSHARE_TOKEN 提升配额(SDK 自动读取, 不必填 UI Key)。

name: zzshare
display_name: "zzshare"
runtime: python
entry: app.plugins.zzshare.provider:ZzshareProvider
check: app.plugins.zzshare.provider:availability
datasets: [financial]
description: "zzshare 免费 A股量化数据 SDK。当前提供：财务指标/利润表/资产负债表/现金流量表；未声明日K/分钟/实时，自动回退 TickFlow。"
install_hint: "点击安装（pip install zzshare），或手动运行 pip install zzshare"